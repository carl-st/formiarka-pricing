version: "3.9"
services:
  pricing:
    build: .
    container_name: print-pricing
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CURRENCY=PLN
      - FILAMENT_COST_PER_KG=100
      - ENERGY_COST_PER_KWH=1.5
      - PRINTER_POWER_W=200
      - HOURLY_RATE=20
      - MAINTENANCE_RATE_PER_HOUR=5
      - MARKUP_PCT=50
      - MIN_JOB_FEE=0
      - PRUSA_CONFIG_BUNDLE=/configs/printer.ini
      - TMP_DIR=/tmp
    volumes:
      - tmpdata:/tmp
      - ./configs:/configs:ro # if using custom profiles
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
volumes:
  tmpdata:
