# Bambu P1S (zbliżone czasy) — profil do estymacji czasu w PrusaSlicer
# Pole robocze zostaje 240x240x240 (zgodnie z Twoim wymaganiem)
# Jeśli faktycznie chcesz 256³, zmień bed_shape i limit w backendzie.

[printer]
bed_shape = 0x0,240x0,240x240,0x240
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.30
z_offset = 0

# Prędkości (mm/s) — zbliżone do Bambu "Standard/Sport"
perimeter_speed = 180
small_perimeter_speed = 160
external_perimeter_speed = 150
infill_speed = 200
solid_infill_speed = 180
top_solid_infill_speed = 150
gap_fill_speed = 120
bridge_speed = 80
travel_speed = 300

first_layer_speed = 40
first_layer_infill_speed = 40
first_layer_travel_speed = 150

# Akceleracje (mm/s^2)
default_acceleration = 8000
perimeter_acceleration = 8000
infill_acceleration = 10000
bridge_acceleration = 6000
first_layer_acceleration = 3000
travel_acceleration = 12000

# Limity maszyny (kroczki max)
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 20
machine_max_feedrate_e = 120

machine_max_acceleration_x = 12000
machine_max_acceleration_y = 12000
machine_max_acceleration_z = 1000
machine_max_acceleration_e = 5000

# Ekstruzja / retrakcja (bezpieczne wartości, nie wpływają mocno na czas)
filament_diameter = 1.75
extrusion_multiplier = 1
max_volumetric_speed = 26
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0

# Podpory nie są tu istotne (i tak wymuszasz je w CLI), ale ustawione na wszelki
support_material = 1
support_material_auto = 1
support_material_threshold = 60

# Neutralne drobiazgi
seam_position = aligned
elefant_foot_compensation = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
